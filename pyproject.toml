[project]
name = "cardprofiler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soufyane El Omrani", email = "elomranisoufyan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fg-data-profiling>=4.20.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "numpy>=2.4.6",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
]

[project.scripts]
cardprofiler = "cardprofiler:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
